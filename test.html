<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FitDash native tests</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial; background:#0b0b10; color:#e8e8f2; padding:20px; }
    .wrap { max-width:900px; margin:0 auto; }
    h1 { font-size:18px; }
    .results { margin-top:16px; }
    .test { padding:10px 12px; border-radius:8px; margin-bottom:8px; background:#111118; border:1px solid #2a2a3c; display:flex; justify-content:space-between; align-items:center; }
    .ok { color:#4ade80; font-weight:700 }
    .fail { color:#ff6b35; font-weight:700 }
    #runner { margin-top:12px }
    iframe { width:100%; height:320px; border:1px solid #2a2a3c; border-radius:8px; background:#000; }
    .note { color:#9090b0; font-size:13px }
    button { padding:8px 12px; border-radius:8px; background:#1e1e28; color:var(--text); border:1px solid #353548; cursor:pointer }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FitDash: Native browser tests — `save()` and `safeLoad()`</h1>
    <p class="note">This page loads <strong>fitdash.html</strong> in an iframe (same folder). Run the tests and view pass/fail below. Open in your browser via file:/// or from a local server.</p>

    <div id="runner">
      <button id="runBtn">Run tests</button>
      <button id="openApp" style="margin-left:8px">Open app in new tab</button>
    </div>

    <div class="results" id="results"></div>

    <h2 style="margin-top:18px">App iframe (for debug)</h2>
    <iframe id="appFrame" src="fitdash.html"></iframe>
  </div>

<script>
  const runBtn = document.getElementById('runBtn');
  const results = document.getElementById('results');
  const iframe = document.getElementById('appFrame');
  const openBtn = document.getElementById('openApp');

  function addResult(name, passed, info) {
    const el = document.createElement('div');
    el.className = 'test';
    el.innerHTML = `<div>${name}</div><div class='${passed? 'ok':'fail'}'>${passed? 'PASS':'FAIL'}</div>`;
    if(info) {
      const pre = document.createElement('pre');
      pre.style.marginTop = '8px'; pre.style.fontSize = '12px'; pre.style.color = '#9090b0';
      pre.textContent = info;
      el.appendChild(pre);
    }
    results.appendChild(el);
  }

  function clearResults(){ results.innerHTML = ''; }

  async function runTests() {
    clearResults();
    addResult('Waiting for app iframe to load', true);

    if(!iframe.contentWindow || !iframe.contentWindow.document || iframe.contentWindow.document.readyState !== 'complete') {
      // wait for load
      await new Promise((res)=>{
        iframe.addEventListener('load', ()=>res(), { once: true });
        // fallback timeout
        setTimeout(res, 1500);
      });
    }

    const w = iframe.contentWindow;
    if(!w) { addResult('Access iframe window', false, 'Unable to access iframe contentWindow — ensure same folder and file:// origin'); return; }

    // Test 1: functions exist
    const hasSave = typeof w.save === 'function';
    const hasSafe = typeof w.safeLoad === 'function';
    addResult('save() exists', hasSave);
    addResult('safeLoad() exists', hasSafe);

    // Early exit if missing
    if(!hasSave || !hasSafe) return;

    try {
      // Clean up previous keys
      w.localStorage.removeItem('fitdash_test_key');
      // Test 2: save writes and returns true
      const ok = w.save('fitdash_test_key', { a: 1, b: 'two' });
      const raw = w.localStorage.getItem('fitdash_test_key');
      const correct = raw === JSON.stringify({ a:1, b:'two' });
      addResult('save() writes JSON and returns true', ok === true && correct, `save returned: ${ok}\nstored: ${raw}`);

      // Test 3: safeLoad reads value back
      const loaded = w.safeLoad('fitdash_test_key', null);
      const loadedOk = loaded && loaded.a === 1 && loaded.b === 'two';
      addResult('safeLoad() reads stored object', loadedOk, `loaded: ${JSON.stringify(loaded)}`);

      // Test 4: safeLoad falls back on corrupted JSON and removes the key
      w.localStorage.setItem('fitdash_corrupt', '{ this is : bad JSON');
      const fallback = { fallback: true };
      const res = w.safeLoad('fitdash_corrupt', fallback);
      const removed = w.localStorage.getItem('fitdash_corrupt') === null;
      const fallbackOk = res && res.fallback === true;
      addResult('safeLoad() returns fallback for corrupted JSON', fallbackOk && removed, `returned: ${JSON.stringify(res)}; present after: ${!removed}`);

      // Cleanup
      w.localStorage.removeItem('fitdash_test_key');
      w.localStorage.removeItem('fitdash_corrupt');
      
      // Test 5: exportAllData redacts API key when not stored
      try {
        w.localStorage.setItem('fitdash_ai_config', JSON.stringify({ provider: 'openai', apiKey: 'SECRET_X', storeKey: false }));
        let captured = null;
        const origCreate = w.URL.createObjectURL;
        // intercept blob creation to inspect payload
        w.URL.createObjectURL = function(blob) { captured = blob; return 'blob://captured'; };
        try { if(typeof w.exportAllData === 'function') w.exportAllData(); } catch(e) { /* ignore click-driven behavior */ }
        // restore
        w.URL.createObjectURL = origCreate;
        if(captured) {
          const reader = new w.FileReader();
          const text = await new Promise((res) => { reader.onload = () => res(reader.result); reader.readAsText(captured); });
          let parsed = {};
          try { parsed = JSON.parse(text); } catch(e) { parsed = {}; }
          const ok = parsed['fitdash_ai_config'] && JSON.parse(parsed['fitdash_ai_config']).apiKey === '[REDACTED]';
          addResult('exportAllData redacts API key when storeKey=false', ok, text.slice(0,300));
        } else {
          addResult('exportAllData redacts API key when storeKey=false', false, 'No exported blob captured');
        }
      } catch(e) { addResult('exportAllData redaction (exception)', false, String(e)); }

      // Test 6: importAllData should load keys from a JSON file
      try {
        // prepare a small backup file containing a fitdash_ key
        const payload = { fitdash_test_import: JSON.stringify({ imported: true }) };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const file = new File([blob], 'backup.json', { type: 'application/json' });
        // prevent actual reload during the test
        const origReload = w.location.reload;
        w.location.reload = () => { /* noop for test */ };
        // call importAllData with a fake event object
        if(typeof w.importAllData === 'function') await Promise.resolve(w.importAllData({ target: { files: [file] } }));
        const present = w.localStorage.getItem('fitdash_test_import') !== null;
        addResult('importAllData loads keys from backup file', present, `stored: ${w.localStorage.getItem('fitdash_test_import')}`);
        // cleanup
        w.localStorage.removeItem('fitdash_test_import');
        w.location.reload = origReload;
      } catch(e) { addResult('importAllData test (exception)', false, String(e)); }

      // Test 7: recent-food add and remove
      try {
        const prePills = iframe.contentDocument.querySelectorAll('.recent-food-pill').length;
        // prefer to use saveRecentFood if available
        if(typeof w.saveRecentFood === 'function') {
          w.saveRecentFood({ name: 'Unit Test Food', kcal: 150, protein: 10, carbs: 12, fat: 5, grams: 100, country: 'INT' });
          // allow any UI render to occur
          await new Promise(res => setTimeout(res, 200));
        } else {
          // fallback: write directly to localStorage and call renderCalorieTracker
          const rf = JSON.parse(w.localStorage.getItem('fitdash_recent_foods') || '[]');
          rf.unshift({ name: 'Unit Test Food', kcal:150, protein:10, carbs:12, fat:5, grams:100, country:'INT' });
          w.localStorage.setItem('fitdash_recent_foods', JSON.stringify(rf.slice(0,6)));
          if(typeof w.renderCalorieTracker === 'function') w.renderCalorieTracker();
          await new Promise(res => setTimeout(res, 200));
        }
        const midPills = iframe.contentDocument.querySelectorAll('.recent-food-pill');
        const added = Array.from(midPills).some(el => el.textContent.includes('Unit Test Food'));
        addResult('recent food added to UI', added, `before:${prePills}, after:${midPills.length}`);

        // Now remove via removeRecentFood if available, else click pill delete
        if(typeof w.removeRecentFood === 'function') {
          w.removeRecentFood('Unit Test Food');
          if(typeof w.renderCalorieTracker === 'function') w.renderCalorieTracker();
          await new Promise(res => setTimeout(res, 200));
        } else {
          const btn = Array.from(iframe.contentDocument.querySelectorAll('.recent-food-pill .del-btn-sm')).find(b => b.getAttribute('aria-label') && b.getAttribute('aria-label').includes('Unit Test Food'));
          if(btn) { btn.click(); await new Promise(res => setTimeout(res, 200)); }
        }
        const afterRemove = Array.from(iframe.contentDocument.querySelectorAll('.recent-food-pill')).some(el => el.textContent.includes('Unit Test Food')) === false;
        addResult('recent food removed from UI', afterRemove);
      } catch(e) { addResult('recent-food add/remove test (exception)', false, String(e)); }

      // Test 8: plan preview on dashboard reflects active plan
      try {
        // ensure dashboard active
        if(typeof w.showPage === 'function') w.showPage('dashboard');
        await new Promise(res => setTimeout(res, 200));
        const preview = iframe.contentDocument.getElementById('dash-plan-preview');
        const hasPreview = preview && preview.style.display !== 'none' && preview.innerText.trim().length > 0;
        addResult('dashboard plan preview visible', hasPreview, preview ? preview.innerText.trim().slice(0,120) : 'no preview element');
      } catch(e) { addResult('plan preview test (exception)', false, String(e)); }
    } catch(err) {
      addResult('Exception during tests', false, String(err));
    }
  }

  runBtn.addEventListener('click', runTests);
  openBtn.addEventListener('click', ()=>{ window.open('fitdash.html', '_blank'); });
</script>
</body>
</html>
